name: Rewind
description: 'Rewind is an Ottawa-based SaaS data backup and recovery company that provides
  automated, item-level backups and rapid self-serve restoration for more than 20 cloud
  applications across ecommerce, development, accounting, productivity, and IT/security
  categories, including Shopify, BigCommerce, Klaviyo, Mailchimp, GitHub, Jira, Confluence,
  Bitbucket, Azure DevOps, Miro, QuickBooks Online, monday.com, Trello, Okta, and MS
  Entra ID. Trusted by 25,000+ organizations protecting over 7 petabytes of data, Rewind
  is SOC 2 Type II, ISO 27001, HIPAA, GDPR, and CCPA aligned. Rewind is backed by Bessemer
  Venture Partners and Insight Partners. Rewind delivers its protection as a hosted SaaS
  product and does not publish a public developer API; this profile captures its security
  posture and public web properties.'
